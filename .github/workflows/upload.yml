name: Upload Python Package

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install '.[tests]'
      - name: Check import order with isort
        run: |
          isort --check-only --diff clickhouse_plantuml tests
      - name: Check formatting with black
        run: |
          black --check .
      - name: Lint with pylint
        run: |
          pylint clickhouse_plantuml
      - name: Test with pytest
        run: |
          pytest
      - name: Check the version matches the tag
        run: |
          VERSION=$(python -c "from clickhouse_plantuml import __version__; print(__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "Tag v${TAG} does not match package version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Check the package is not uploaded yet
        id: check_pkg_exists
        continue-on-error: true
        run: |
          echo "If this step fails, the package is already uploaded — skipping publish"
          pip download --no-deps "clickhouse-plantuml==${VERSION}" && exit 1 || exit 0
      - name: Build and publish
        if: ${{ steps.check_pkg_exists.outcome == 'success' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          twine upload dist/*
