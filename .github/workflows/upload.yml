name: Upload Python Package

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install '.[tests]'
      - name: Check import order with isort
        run: |
          isort --check-only --diff clickhouse_plantuml tests
      - name: Check formatting with black
        run: |
          black --check .
      - name: Lint with pylint
        run: |
          pylint clickhouse_plantuml
      - name: Test with pytest
        run: |
          pytest
      - name: Check the version matches the tag
        run: |
          VERSION=$(python -c "from clickhouse_plantuml import __version__; print(__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "Tag v${TAG} does not match package version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
